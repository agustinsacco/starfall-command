name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a main push: each one is a release candidate. PRs supersede themselves.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm audit
      - name: Unit tests with coverage floor
        run: npm run test:coverage
      - name: Workflow lint (pinned actionlint)
        run: |
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          ./actionlint -color

  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - id: meta
        run: npm run release:metadata
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: release/release-info.json
          retention-days: 7
          if-no-files-found: error

  build:
    name: Test and package (${{ matrix.platform }})
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            electron-cache: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
          - os: ubuntu-latest
            platform: linux
            electron-cache: |
              ~/.cache/electron
              ~/.cache/electron-builder
          - os: windows-latest
            platform: win
            electron-cache: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.electron-cache }}
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Linux package tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools rpm
      # No release write token or signing secrets in PR builds.
      - name: Package installers
        env:
          CSC_LINK: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os == 'macOS' && secrets.MAC_CERT_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: npm run dist:${{ matrix.platform }}
      - name: Verify complete platform asset set
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/verify-release.mjs
      - name: Browser gameplay
        if: runner.os != 'Windows'
        env:
          CHROME_PATH: ${{ runner.os == 'Linux' && '/usr/bin/google-chrome' || '' }}
        run: npm run test:browser
      - name: Packaged Mac gameplay and save-on-quit
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ARCH=$(node -p process.arch)
          DIR=mac
          if [ "$ARCH" = arm64 ]; then DIR=mac-arm64; fi
          export STARFALL_EXECUTABLE="$PWD/release/$DIR/Starfall Command.app/Contents/MacOS/Starfall Command"
          export STARFALL_EXPECTED_VERSION="$RELEASE_VERSION"
          npm run test:electron
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
