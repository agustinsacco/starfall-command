name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main-push CI run to publish (retry only; no test bypass)
        required: true
        type: string

permissions:
  contents: read
  actions: read

# PR completions never cancel or displace a main release. Uploads are not interrupted.
concurrency:
  group: release-${{ (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')) && 'main' || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # No rebuild here: publish the EXACT artifacts whose CI run succeeded.
      - name: Validate and publish tested installers
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
          RELEASE_PUBLISH_DIR: release-publish
        run: node scripts/publish-release.mjs
      # Signed SLSA provenance for the exact published bytes; verify with `gh attestation verify`.
      - name: Attest build provenance
        if: steps.publish.outputs.published == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-publish/*
